<style>
  :root{
    --paper:#EFF1F1; --surface:#FAFBFA; --ink:#191D1C; --muted:#59625E;
    --line:#DCE0DD; --pine:#16624B; --amber:#B5791B; --clay:#A6442F;
    --output-bg:#F1F5F2; --focus:#2A7D63; --radius:10px; --maxw:760px;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--paper);color:var(--ink);font-family:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:20px 20px 48px}
  header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 0 22px;border-bottom:1px solid var(--line)}
  .mark{font-weight:600;font-size:1.02rem;letter-spacing:-0.01em}
  .mark span{color:var(--muted);font-weight:400}
  .status{display:inline-flex;align-items:center;gap:8px;padding:6px 12px 6px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:0.82rem;color:var(--muted);white-space:nowrap}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none}
  .status[data-state="checking"] .dot{background:var(--muted);animation:pulse 1.2s ease-in-out infinite}
  .status[data-state="ready"]{color:var(--pine);border-color:#BFD9CE}
  .status[data-state="ready"] .dot{background:var(--pine);box-shadow:0 0 0 3px rgba(22,98,75,.14)}
  .status[data-state="downloading"]{color:var(--amber);border-color:#E7D3A6}
  .status[data-state="downloading"] .dot{background:var(--amber)}
  .status[data-state="unavailable"]{color:var(--clay);border-color:#E4C2B8}
  .status[data-state="unavailable"] .dot{background:var(--clay)}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
  @media (prefers-reduced-motion:reduce){.status[data-state="checking"] .dot{animation:none}}
  .field{margin-top:26px}
  .field-label{font-size:.86rem;color:var(--muted);margin-bottom:8px}
  textarea{width:100%;min-height:172px;resize:vertical;padding:14px 15px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);color:var(--ink);font-family:"Newsreader",Georgia,serif;font-size:1.06rem;line-height:1.6}
  textarea::placeholder{color:#9AA29D;font-style:italic}
  textarea:focus-visible,select:focus-visible,button:focus-visible,.filebtn:focus-within{outline:2px solid var(--focus);outline-offset:2px}
  textarea.drop{border-color:var(--pine);background:#EEF5F1}
  .filerow{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
  .filebtn{display:inline-block;cursor:pointer;border:1px solid var(--line);border-radius:var(--radius);padding:8px 14px;font-size:.86rem;background:var(--surface);color:var(--ink)}
  .filebtn:hover{border-color:var(--ink)}
  .filestat{font-size:.82rem;color:var(--muted)}
  .actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:16px}
  button{font:inherit;cursor:pointer;border-radius:var(--radius);padding:10px 16px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);font-weight:500;transition:transform .04s ease}
  button:active{transform:translateY(1px)}
  button.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
  button:disabled{opacity:.42;cursor:not-allowed}
  .translate-group{display:inline-flex;align-items:stretch;border:1px solid var(--ink);border-radius:var(--radius);overflow:hidden}
  .translate-group button{border:none;border-radius:0}
  .translate-group select{border:none;border-left:1px solid rgba(239,241,241,.35);background:var(--ink);color:var(--paper);font:inherit;padding:0 10px;cursor:pointer}
  .spacer{flex:1 1 auto}
  .out-head{display:flex;align-items:center;justify-content:space-between;margin-top:30px;margin-bottom:8px}
  .out-head .field-label{margin:0}
  .out-tools{display:flex;gap:8px}
  .out-tools button{padding:6px 11px;font-size:.82rem;background:transparent;color:var(--muted);border-color:var(--line)}
  .out-tools button:hover{color:var(--ink)}
  .output{border:1px solid var(--line);border-radius:var(--radius);background:var(--output-bg);min-height:120px;max-height:60vh;overflow:auto;padding:18px 20px;font-family:"Newsreader",Georgia,serif;font-size:1.12rem;line-height:1.66;white-space:pre-wrap;word-break:break-word}
  .output.empty{color:var(--muted);font-style:italic;display:flex;align-items:center}
  .output .caret{display:inline-block;width:2px;height:1.05em;background:var(--pine);margin-left:1px;vertical-align:text-bottom;animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  @media (prefers-reduced-motion:reduce){.output .caret{animation:none}}
  .note{margin-top:12px;font-size:.82rem;color:var(--muted)}
  .note code{font-family:"IBM Plex Mono",ui-monospace,monospace;background:#E4E8E5;padding:1px 5px;border-radius:4px}
  footer{margin-top:40px;padding-top:18px;border-top:1px solid var(--line);font-size:.8rem;color:var(--muted)}
  footer b{font-weight:500;color:var(--ink)}
  @media (max-width:520px){header{flex-direction:column;align-items:flex-start;gap:12px}.translate-group{width:100%}.translate-group button{flex:1}}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="mark">Local reading companion <span>— on-device</span></div>
    <div class="status" id="status" data-state="checking" role="status" aria-live="polite">
      <span class="dot" aria-hidden="true"></span>
      <span id="statusText">Checking your device…</span>
    </div>
  </header>

  <div class="field">
    <div class="field-label">Paste text, drop a file, or choose one — .txt .md .docx .pdf or an image</div>
    <textarea id="input" placeholder="Paste anything, or add a file below. Text, Word docs, PDFs, and images are all read on this device."></textarea>
    <div class="filerow">
      <label class="filebtn">Choose file
        <input type="file" id="file" accept=".txt,.md,.docx,.pdf,image/*" hidden />
      </label>
      <span class="filestat" id="fileStat"></span>
    </div>
  </div>

  <div class="actions">
    <button id="btnSummarize" data-task="summarize">Summarize</button>
    <button id="btnExplain" class="ghost" data-task="explain">Explain simply</button>
    <div class="translate-group">
      <button id="btnTranslate" data-task="translate">Translate</button>
      <select id="lang" aria-label="Translate into">
        <option value="Hindi">Hindi</option>
        <option value="Telugu">Telugu</option>
        <option value="Spanish">Spanish</option>
        <option value="French">French</option>
        <option value="German">German</option>
        <option value="Japanese">Japanese</option>
        <option value="Arabic">Arabic</option>
      </select>
    </div>
    <div class="spacer"></div>
    <button id="btnStop" class="ghost" hidden>Stop</button>
  </div>

  <div class="out-head">
    <div class="field-label">Result</div>
    <div class="out-tools">
      <button id="btnCopy" hidden>Copy</button>
      <button id="btnClear" hidden>Clear</button>
    </div>
  </div>
  <div class="output empty" id="output" aria-live="polite">Your result will appear here — and never leaves this device.</div>

  <div class="note" id="hint"></div>

  <footer>Designed &amp; Architected by <b>Krishnamurthy Kandregula</b> · Made by Claude</footer>
</div>

<script>
"use strict";

/* ========================================================================
   1. CONFIG
   ======================================================================== */
const HOSTED_ENDPOINT = "";   // Tier 3. Wire to your proxy for guaranteed iPhone support.

const WEBLLM_CDN = "https://esm.run/@mlc-ai/web-llm";
// Phones have tight WebGPU buffer limits -> use tiny models. Desktop can go bigger.
const MODEL_PREFS_MOBILE  = ["Qwen2.5-0.5B-Instruct-q4f16_1-MLC","SmolLM2-360M-Instruct-q4f16_1-MLC","TinyLlama-1.1B-Chat-v1.0-q4f16_1-MLC","Llama-3.2-1B-Instruct-q4f16_1-MLC"];
const MODEL_PREFS_DESKTOP = ["Llama-3.2-1B-Instruct-q4f16_1-MLC","Qwen2.5-1.5B-Instruct-q4f16_1-MLC","Qwen2.5-0.5B-Instruct-q4f16_1-MLC","SmolLM2-1.7B-Instruct-q4f16_1-MLC"];

const IS_MOBILE = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) || navigator.maxTouchPoints > 1;

const SYSTEM_PROMPTS = {
  summarize: "You are a concise summarizer. Return the key points of the text as a short, faithful summary. No preamble, no opinions.",
  explain:   "You explain text in plain language for a general reader. Keep the meaning exact; simplify only the wording.",
  translate: (lang) => "You are a translator. Translate the user's text into " + lang + ". Output only the translation, nothing else."
};

/* ========================================================================
   2. STATE + ELEMENTS
   ======================================================================== */
const el = {
  status:document.getElementById("status"), statusText:document.getElementById("statusText"),
  input:document.getElementById("input"), output:document.getElementById("output"),
  hint:document.getElementById("hint"), stop:document.getElementById("btnStop"),
  copy:document.getElementById("btnCopy"), clear:document.getElementById("btnClear"),
  lang:document.getElementById("lang"), file:document.getElementById("file"), fileStat:document.getElementById("fileStat"),
};
const taskButtons = [...document.querySelectorAll("[data-task]")];
let currentController = null, webllmModule = null, webllmEngine = null, webgpuReady = false;

/* ========================================================================
   3. CAPABILITY DETECTION
   ======================================================================== */
function hasPromptAPI(){ return "LanguageModel" in self; }
async function probeWebGPU(){
  if(!("gpu" in navigator)) return false;
  try{ const a = await navigator.gpu.requestAdapter(); webgpuReady = !!a; return webgpuReady; }
  catch(e){ webgpuReady = false; return false; }
}
function setStatus(state, text){ el.status.dataset.state = state; el.statusText.textContent = text; }

async function checkAvailability(){
  if(hasPromptAPI()){
    try{
      const a = await LanguageModel.availability();
      if(a === "available"){ setStatus("ready","On-device · ready"); el.hint.textContent=""; return; }
      if(a === "downloadable"){ setStatus("ready","On-device · ready to download"); el.hint.textContent="First run downloads Gemini Nano (~2.7–4GB) once, then works offline."; return; }
      if(a === "downloading"){ setStatus("downloading","On-device · downloading…"); return; }
    }catch(e){}
  }
  if(await probeWebGPU()){
    setStatus("ready","On-device · WebGPU");
    el.hint.textContent = "First run downloads a small model once, then works offline. On iPhone this needs iOS 26+.";
    return;
  }
  if(HOSTED_ENDPOINT){ setStatus("ready","Hosted model"); el.hint.textContent="No on-device model here, so requests use your hosted model."; return; }
  setStatus("unavailable","Not available");
  el.hint.innerHTML = "No on-device model. On iPhone, update to iOS 26+ for WebGPU, or set a hosted fallback in the code.";
}

/* ========================================================================
   4. FILE INPUT — read docx / pdf / image on-device, into the textarea
   ======================================================================== */
function setFileStat(t){ el.fileStat.textContent = t; }
function loadScript(src){
  return new Promise((res,rej)=>{ const s=document.createElement("script"); s.src=src; s.onload=res; s.onerror=()=>rej(new Error("Failed to load "+src)); document.head.appendChild(s); });
}
async function extractText(file){
  const name=(file.name||"").toLowerCase(), type=file.type||"";
  if(type.startsWith("text")||name.endsWith(".txt")||name.endsWith(".md")) return (await file.text());
  if(name.endsWith(".docx")) return await extractDocx(file);
  if(name.endsWith(".pdf")||type==="application/pdf") return await extractPdf(file);
  if(type.startsWith("image/")) return await extractImage(file);
  throw new Error("Unsupported file type. Use .txt, .md, .docx, .pdf, or an image.");
}
async function extractDocx(file){
  if(!window.mammoth) await loadScript("https://cdn.jsdelivr.net/npm/mammoth@1/mammoth.browser.min.js");
  const r = await window.mammoth.extractRawText({ arrayBuffer: await file.arrayBuffer() });
  return (r.value||"").trim();
}
async function extractPdf(file){
  const pdfjs = await import("https://cdn.jsdelivr.net/npm/pdfjs-dist@4/build/pdf.min.mjs");
  pdfjs.GlobalWorkerOptions.workerSrc = "https://cdn.jsdelivr.net/npm/pdfjs-dist@4/build/pdf.worker.min.mjs";
  const doc = await pdfjs.getDocument({ data: await file.arrayBuffer() }).promise;
  const pages=[];
  for(let i=1;i<=doc.numPages;i++){
    setFileStat("Reading PDF page " + i + "/" + doc.numPages + "…");
    const tc = await (await doc.getPage(i)).getTextContent();
    pages.push(tc.items.map(it=>it.str).join(" "));
  }
  const text = pages.join("\n\n").trim();
  if(!text) throw new Error("No selectable text — this PDF looks scanned. Export a page as an image to OCR it.");
  return text;
}
async function extractImage(file){
  if(!window.Tesseract) await loadScript("https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js");
  setFileStat("Reading image (OCR) — first run downloads the OCR model…");
  const { data } = await window.Tesseract.recognize(file, "eng", { logger:m=>{ if(m.status==="recognizing text") setFileStat("OCR " + Math.round(m.progress*100) + "%"); } });
  const text=(data.text||"").trim();
  if(!text) throw new Error("No text found in the image.");
  return text;   // English OCR by default; add lang packs for Telugu/Hindi source text.
}
async function onFile(file){
  if(!file) return;
  setFileStat("Reading " + file.name + "…");
  try{
    const text = await extractText(file);
    el.input.value = text;
    setFileStat(file.name + " · " + text.length.toLocaleString() + " characters read");
  }catch(err){ setFileStat("Couldn't read that file: " + (err.message||err)); }
}

/* ========================================================================
   5. RUN A TASK — cascade through supported tiers
   ======================================================================== */
async function run(task){
  const text = el.input.value.trim();
  if(!text){ el.input.focus(); return; }
  const system = task === "translate" ? SYSTEM_PROMPTS.translate(el.lang.value) : SYSTEM_PROMPTS[task];

  const tiers = [];
  if(hasPromptAPI()) tiers.push("prompt");
  if(webgpuReady || ("gpu" in navigator)) tiers.push("webgpu");
  if(HOSTED_ENDPOINT) tiers.push("hosted");
  if(tiers.length === 0){ writeError("No model available on this device. Open on desktop Chrome 148+, an iPhone on iOS 26+, or set HOSTED_ENDPOINT."); return; }

  beginRun();
  let done=false, lastErr=null;
  for(const tier of tiers){
    try{
      if(tier==="prompt") await runPromptAPI(system, text);
      else if(tier==="webgpu") await runWebGPU(system, text);
      else await runHosted(task, system, text);
      done=true; break;
    }catch(err){
      if(err && err.name === "AbortError"){ done=true; break; }
      lastErr=err; console.warn("tier '"+tier+"' failed:", err);
    }
  }
  if(!done){
    const msg = lastErr ? (lastErr.message || String(lastErr)) : "unknown error";
    writeError("Couldn't complete on this device.\n\nReason: " + msg + "\n\nIf WebGPU keeps failing on iPhone, wiring the hosted fallback (HOSTED_ENDPOINT) is the reliable path.");
  }
  endRun();
}

async function runPromptAPI(system, text){
  currentController = new AbortController();
  const session = await LanguageModel.create({
    initialPrompts:[{ role:"system", content:system }], signal:currentController.signal,
    monitor(m){ m.addEventListener("downloadprogress", e => setStatus("downloading","On-device · downloading "+Math.round((e.loaded||0)*100)+"%")); }
  });
  setStatus("ready","On-device · ready"); startOutput();
  const stream = session.promptStreaming(text, { signal:currentController.signal });
  for await (const chunk of stream) appendOutput(chunk);
  finishOutput(); session.destroy && session.destroy();
}

function pickModel(mod){
  const cfg = mod && mod.prebuiltAppConfig;
  if(!cfg || !Array.isArray(cfg.model_list)) throw new Error("WebLLM model list unavailable");
  const ids = cfg.model_list.map(m => m.model_id);
  const prefs = IS_MOBILE ? MODEL_PREFS_MOBILE : MODEL_PREFS_DESKTOP;
  for(const p of prefs) if(ids.includes(p)) return p;
  return ids.find(id => /Instruct|-it-|Chat/i.test(id)) || ids[0];
}
async function ensureWebLLM(){
  if(!webllmModule) webllmModule = await import(WEBLLM_CDN);
  if(!webllmEngine){
    const model = pickModel(webllmModule);
    setStatus("downloading","On-device · loading " + model.split("-").slice(0,2).join(" ") + "…");
    webllmEngine = await webllmModule.CreateMLCEngine(model, {
      initProgressCallback: r => setStatus("downloading","On-device · "+Math.round((r.progress||0)*100)+"%")
    });
  }
  return webllmEngine;
}
async function runWebGPU(system, text){
  currentController = new AbortController();
  const engine = await ensureWebLLM();
  setStatus("ready","On-device · WebGPU"); startOutput();
  const stream = await engine.chat.completions.create({ stream:true, messages:[{role:"system",content:system},{role:"user",content:text}] });
  for await (const chunk of stream){
    if(currentController.signal.aborted){ engine.interruptGenerate && engine.interruptGenerate(); throw new DOMException("stopped","AbortError"); }
    const d = chunk.choices && chunk.choices[0] && chunk.choices[0].delta ? chunk.choices[0].delta.content : "";
    if(d) appendOutput(d);
  }
  finishOutput();
}

async function runHosted(task, system, text){
  currentController = new AbortController();
  const body = await callHostedModel({ task, system, text, signal:currentController.signal });
  startOutput();
  if(body && typeof body.getReader === "function"){
    const reader=body.getReader(), dec=new TextDecoder();
    for(;;){ const {value,done}=await reader.read(); if(done) break; appendOutput(dec.decode(value,{stream:true})); }
  }else if(typeof body === "string"){ appendOutput(body); }
  finishOutput();
}
async function callHostedModel({ task, system, text, signal }){
  throw new Error("hosted fallback not configured (HOSTED_ENDPOINT is empty)");
  /*  const res = await fetch(HOSTED_ENDPOINT, { method:"POST", headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({ task, system, text }), signal });
      if(!res.ok) throw new Error("hosted " + res.status);
      return res.body;  */
}

/* ========================================================================
   6. OUTPUT + UI
   ======================================================================== */
let outText="";
function startOutput(){ outText=""; el.output.classList.remove("empty"); el.output.innerHTML='<span class="caret"></span>'; }
function appendOutput(chunk){ outText+=chunk; el.output.innerHTML=escapeHtml(outText)+'<span class="caret"></span>'; el.output.scrollTop=el.output.scrollHeight; }
function finishOutput(){ el.output.textContent=outText; el.copy.hidden=el.clear.hidden=outText.length===0; }
function writeError(msg){ el.output.classList.remove("empty"); el.output.textContent=msg; el.copy.hidden=el.clear.hidden=true; }
function escapeHtml(s){ return s.replace(/[&<>]/g,c=>({ "&":"&amp;","<":"&lt;",">":"&gt;" }[c])); }
function beginRun(){ taskButtons.forEach(b=>b.disabled=true); el.stop.hidden=false; }
function endRun(){ taskButtons.forEach(b=>b.disabled=false); el.stop.hidden=true; currentController=null; }

taskButtons.forEach(b=>b.addEventListener("click",()=>run(b.dataset.task)));
el.stop.addEventListener("click",()=>{ currentController&&currentController.abort(); webllmEngine&&webllmEngine.interruptGenerate&&webllmEngine.interruptGenerate(); });
el.copy.addEventListener("click",async()=>{ try{ await navigator.clipboard.writeText(outText); el.copy.textContent="Copied"; setTimeout(()=>el.copy.textContent="Copy",1200);}catch(e){} });
el.clear.addEventListener("click",()=>{ outText=""; el.output.className="output empty"; el.output.textContent="Your result will appear here — and never leaves this device."; el.copy.hidden=el.clear.hidden=true; });
el.file.addEventListener("change",e=>onFile(e.target.files&&e.target.files[0]));

el.input.addEventListener("dragover",e=>{ e.preventDefault(); el.input.classList.add("drop"); });
el.input.addEventListener("dragleave",()=>el.input.classList.remove("drop"));
el.input.addEventListener("drop",async e=>{ e.preventDefault(); el.input.classList.remove("drop"); const f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0]; if(f) onFile(f); });

if("serviceWorker" in navigator){ window.addEventListener("load",()=>{ navigator.serviceWorker.register("./sw.js").catch(()=>{}); }); }

checkAvailability();
</script>
</body>
</html>
